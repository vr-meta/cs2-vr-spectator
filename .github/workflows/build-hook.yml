name: Build hook

# Builds AfxHookSource2 with this project's patches applied, so a broken patch is caught
# here rather than on the one machine that has the toolchain.
#
# Nothing Valve owns is fetched or published: the job builds HLAE's hook from advancedfx
# (MIT) and uploads only that DLL.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/patches/**'
      - '.github/workflows/build-hook.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/patches/**'
      - '.github/workflows/build-hook.yml'
  schedule:
    # Weekly, so upstream moving out from under the patches is noticed by itself rather
    # than by someone trying to build.
    - cron: '17 4 * * 1'
  workflow_dispatch:

env:
  # The upstream revision the patches are written against. Bump deliberately: the patch
  # carries hard-coded field offsets for a specific CS2 build and will not survive a
  # careless update.
  ADVANCEDFX_REF: v2.192.2
  OPENXR_VERSION: 1.1.63

jobs:
  # The geometry, the stick shaping, the plausibility check on the view struct and the
  # steam.inf parsing have no engine in them, so they are tested here in seconds rather
  # than by putting a headset on. Everything else in this project needs a Quest.
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run
        run: |
          cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tests
          ctest --test-dir build/tests --output-on-failure

  # Two minutes and no toolchain. The patches stopped applying in sequence once already —
  # 002 had been generated from a tree that already had 001 in it, so it carried 001's hunk
  # too — and a full build is a slow way to be told that.
  patches:
    name: Patches apply
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: cs2-vr-spectator

      - name: Check out advancedfx at the pinned revision
        uses: actions/checkout@v4
        with:
          repository: advancedfx/advancedfx
          ref: ${{ env.ADVANCEDFX_REF }}
          path: advancedfx

      - name: Apply
        working-directory: advancedfx
        run: |
          cp ../cs2-vr-spectator/src/AfxHookSource2/* AfxHookSource2/
          # The tree is CRLF; git apply preserves it, unlike anything sed-shaped.
          git apply --verbose ../cs2-vr-spectator/docs/patches/001-vswhere-products.patch
          git apply --verbose ../cs2-vr-spectator/docs/patches/002-per-pass-camera.patch

  # The same check against upstream's moving branch. Advisory: upstream is allowed to move,
  # we just want to know before someone hits it.
  patches-upstream:
    name: Patches apply (upstream main)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: cs2-vr-spectator

      - name: Check out advancedfx main
        uses: actions/checkout@v4
        with:
          repository: advancedfx/advancedfx
          ref: main
          path: advancedfx

      - name: Apply
        working-directory: advancedfx
        run: |
          cp ../cs2-vr-spectator/src/AfxHookSource2/* AfxHookSource2/
          git apply --verbose ../cs2-vr-spectator/docs/patches/001-vswhere-products.patch
          git apply --verbose ../cs2-vr-spectator/docs/patches/002-per-pass-camera.patch

  build:
    name: Build AfxHookSource2
    needs: [patches, tests]
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: cs2-vr-spectator

      - name: Check out advancedfx
        uses: actions/checkout@v4
        with:
          repository: advancedfx/advancedfx
          ref: ${{ env.ADVANCEDFX_REF }}
          path: advancedfx
          submodules: recursive

      - name: Copy in this project's sources and apply the patches
        working-directory: advancedfx
        shell: pwsh
        run: |
          # Our own files are real sources in this repository; only the edits to
          # advancedfx's own files are a patch.
          Copy-Item ../cs2-vr-spectator/src/AfxHookSource2/* AfxHookSource2/ -Force
          git apply --verbose ../cs2-vr-spectator/docs/patches/001-vswhere-products.patch
          git apply --verbose ../cs2-vr-spectator/docs/patches/002-per-pass-camera.patch

      - name: Fetch the OpenXR headers
        shell: pwsh
        run: |
          # Only the headers are needed: the loader is opened by path at runtime, never
          # linked, so the hook still loads in a process that knows nothing about OpenXR.
          New-Item -ItemType Directory -Force openxr | Out-Null
          $url = "https://github.com/KhronosGroup/OpenXR-SDK/releases/download/release-$env:OPENXR_VERSION/OpenXR.Loader.$env:OPENXR_VERSION.nupkg"
          Invoke-WebRequest $url -OutFile openxr/openxr.zip
          Expand-Archive openxr/openxr.zip -DestinationPath openxr/pkg
          if (-not (Test-Path openxr/pkg/include/openxr/openxr.h)) { throw "OpenXR headers not where expected" }

      - name: Install the .NET Framework 4.6.2 targeting pack
        shell: pwsh
        run: |
          # AfxHookSource2 depends on ShaderBuilder, which is a C# project. Without this
          # the build fails with MSB3644, which does not say what is actually missing.
          # The runner image may already carry it; installing over it is harmless, failing
          # to install when it is already there is not a reason to stop.
          $ref = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.2"
          if (Test-Path $ref) {
            "Targeting pack already present at $ref"
          } else {
            choco install netfx-4.6.2-devpack -y --no-progress
            if (-not (Test-Path $ref)) { throw "targeting pack still missing after install" }
          }

      - name: Install Rust
        shell: pwsh
        run: |
          # AfxHookSource2 binds to Rust components through Corrosion.
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc
          rustc --version

      - name: Configure
        working-directory: advancedfx
        shell: pwsh
        env:
          AFXVR_OPENXR_DIR: ${{ github.workspace }}/openxr/pkg
        run: |
          cmake --preset x64-release -DAFXVR_OPENXR_DIR="${{ github.workspace }}/openxr/pkg"

      - name: Build
        working-directory: advancedfx
        shell: pwsh
        run: |
          # ShaderBuilder is invoked by bare name from the hook's CMakeLists, so its output
          # directory has to be on PATH first. Exit code 9009 here means "not found", not a
          # shader problem.
          # The target is lowercase 'shaderbuilder' (its project() name); the directory it
          # builds into is 'ShaderBuilder'. They are not the same word by accident here.
          cmake --build --preset x64-release --target shaderbuilder
          $env:Path = "${{ github.workspace }}/advancedfx/build/x64-release/ShaderBuilder;$env:Path"
          cmake --build --preset x64-release --target AfxHookSource2

      - name: Check the DLL exists
        shell: pwsh
        run: |
          $dll = "advancedfx/build/x64-release/AfxHookSource2/Release/AfxHookSource2.dll"
          if (-not (Test-Path $dll)) { throw "AfxHookSource2.dll was not produced" }
          "{0:N2} MB" -f ((Get-Item $dll).Length / 1MB)

      - name: Upload the hook
        uses: actions/upload-artifact@v4
        with:
          name: AfxHookSource2
          path: |
            advancedfx/build/x64-release/AfxHookSource2/Release/AfxHookSource2.dll
            advancedfx/build/x64-release/AfxHookSource2/Release/AfxHookSource2.pdb
          if-no-files-found: error
