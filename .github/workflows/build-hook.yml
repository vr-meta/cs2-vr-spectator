name: Build hook

# Builds AfxHookSource2 with this project's patches applied, so a broken patch is caught
# here rather than on the one machine that has the toolchain.
#
# Nothing Valve owns is fetched or published: the job builds HLAE's hook from advancedfx
# (MIT) and uploads only that DLL.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/patches/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/build-hook.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/patches/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/build-hook.yml'
  schedule:
    # Weekly, so upstream moving out from under the patches is noticed by itself rather
    # than by someone trying to build.
    - cron: '17 4 * * 1'
  workflow_dispatch:
  # Called by release.yml, which passes the tag. Everything else leaves it empty and gets
  # a hook that says 0.0.0-dev and means it.
  workflow_call:
    inputs:
      version:
        description: 'Version to compile into the hook (AFXVR_VERSION). Empty for a development build.'
        type: string
        required: false
        default: ''

env:
  # The upstream revision the patches are written against. Bump deliberately: the patch
  # carries hard-coded field offsets for a specific CS2 build and will not survive a
  # careless update.
  ADVANCEDFX_REF: v2.192.2
  OPENXR_VERSION: 1.1.63

jobs:
  # The geometry, the stick shaping, the plausibility check on the view struct and the
  # steam.inf parsing have no engine in them, so they are tested here in seconds rather
  # than by putting a headset on. Everything else in this project needs a Quest.
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run
        run: |
          cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tests
          ctest --test-dir build/tests --output-on-failure

      # A bind in a CS2 config is last-one-wins and silent about it, and the person
      # pressing the key has a headset on. Two seconds here, an evening otherwise.
      - name: Key bindings are unambiguous
        shell: pwsh
        run: ./scripts/check-cfg.ps1

      # The control server reads the hook's own log lines and decides who may drive the
      # game. Both are kept free of Windows for exactly this: the parser, the state fold
      # and the access rules are tested here, and only the named pipe and the process
      # lookup need the machine the game is on. Rust is preinstalled on this image.
      - name: Control server
        run: cargo test --manifest-path tools/server/Cargo.toml

  # Two minutes and no toolchain. The patches stopped applying in sequence once already —
  # 002 had been generated from a tree that already had 001 in it, so it carried 001's hunk
  # too — and a full build is a slow way to be told that.
  patches:
    name: Patches apply
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: cs2-vr-spectator

      - name: Check out advancedfx at the pinned revision
        uses: actions/checkout@v4
        with:
          repository: advancedfx/advancedfx
          ref: ${{ env.ADVANCEDFX_REF }}
          path: advancedfx

      - name: Apply
        working-directory: advancedfx
        run: |
          cp ../cs2-vr-spectator/src/AfxHookSource2/* AfxHookSource2/
          # The tree is CRLF; git apply preserves it, unlike anything sed-shaped.
          git apply --verbose ../cs2-vr-spectator/docs/patches/001-vswhere-products.patch
          git apply --verbose ../cs2-vr-spectator/docs/patches/002-per-pass-camera.patch

  # The same check against upstream's moving branch. Advisory: upstream is allowed to move,
  # we just want to know before someone hits it.
  patches-upstream:
    name: Patches apply (upstream main)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: cs2-vr-spectator

      - name: Check out advancedfx main
        uses: actions/checkout@v4
        with:
          repository: advancedfx/advancedfx
          ref: main
          path: advancedfx

      - name: Apply
        working-directory: advancedfx
        run: |
          cp ../cs2-vr-spectator/src/AfxHookSource2/* AfxHookSource2/
          git apply --verbose ../cs2-vr-spectator/docs/patches/001-vswhere-products.patch
          git apply --verbose ../cs2-vr-spectator/docs/patches/002-per-pass-camera.patch

  build:
    name: Build AfxHookSource2
    needs: [patches, tests]
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: cs2-vr-spectator

      - name: Check out advancedfx
        uses: actions/checkout@v4
        with:
          repository: advancedfx/advancedfx
          ref: ${{ env.ADVANCEDFX_REF }}
          path: advancedfx
          submodules: recursive

      - name: Copy in this project's sources and apply the patches
        working-directory: advancedfx
        shell: pwsh
        run: |
          # Our own files are real sources in this repository; only the edits to
          # advancedfx's own files are a patch.
          Copy-Item ../cs2-vr-spectator/src/AfxHookSource2/* AfxHookSource2/ -Force
          git apply --verbose ../cs2-vr-spectator/docs/patches/001-vswhere-products.patch
          git apply --verbose ../cs2-vr-spectator/docs/patches/002-per-pass-camera.patch

      - name: Fetch the OpenXR headers
        shell: pwsh
        run: |
          # Only the headers are needed: the loader is opened by path at runtime, never
          # linked, so the hook still loads in a process that knows nothing about OpenXR.
          New-Item -ItemType Directory -Force openxr | Out-Null
          $url = "https://github.com/KhronosGroup/OpenXR-SDK/releases/download/release-$env:OPENXR_VERSION/OpenXR.Loader.$env:OPENXR_VERSION.nupkg"
          Invoke-WebRequest $url -OutFile openxr/openxr.zip
          Expand-Archive openxr/openxr.zip -DestinationPath openxr/pkg
          if (-not (Test-Path openxr/pkg/include/openxr/openxr.h)) { throw "OpenXR headers not where expected" }

      - name: Install the .NET Framework 4.6.2 targeting pack
        shell: pwsh
        run: |
          # AfxHookSource2 depends on ShaderBuilder, which is a C# project. Without this
          # the build fails with MSB3644, which does not say what is actually missing.
          # The runner image may already carry it; installing over it is harmless, failing
          # to install when it is already there is not a reason to stop.
          $ref = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.2"
          if (Test-Path $ref) {
            "Targeting pack already present at $ref"
          } else {
            choco install netfx-4.6.2-devpack -y --no-progress
            if (-not (Test-Path $ref)) { throw "targeting pack still missing after install" }
          }

      - name: Install Rust
        shell: pwsh
        run: |
          # AfxHookSource2 binds to Rust components through Corrosion.
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc
          rustc --version

      - name: Configure
        working-directory: advancedfx
        shell: pwsh
        env:
          AFXVR_OPENXR_DIR: ${{ github.workspace }}/openxr/pkg
        run: |
          # AFXVR_VERSION is what the hook prints at startup and what a bug report quotes.
          # Left unset here on purpose: this workflow builds main, not a release, and a
          # build from main must not claim a release number. The release workflow passes
          # -DAFXVR_VERSION=<tag>; everything else says 0.0.0-dev and means it.
          $version = '${{ inputs.version }}'
          $stamp = if ($version) { @("-DAFXVR_VERSION=$version") } else { @() }
          cmake --preset x64-release -DAFXVR_OPENXR_DIR="${{ github.workspace }}/openxr/pkg" @stamp

      - name: Build
        working-directory: advancedfx
        shell: pwsh
        run: |
          # ShaderBuilder is invoked by bare name from the hook's CMakeLists, so its output
          # directory has to be on PATH first. Exit code 9009 here means "not found", not a
          # shader problem.
          # The target is lowercase 'shaderbuilder' (its project() name); the directory it
          # builds into is 'ShaderBuilder'. They are not the same word by accident here.
          cmake --build --preset x64-release --target shaderbuilder
          $env:Path = "${{ github.workspace }}/advancedfx/build/x64-release/ShaderBuilder;$env:Path"
          cmake --build --preset x64-release --target AfxHookSource2

      - name: Check the DLL exists
        shell: pwsh
        run: |
          $dll = "advancedfx/build/x64-release/AfxHookSource2/Release/AfxHookSource2.dll"
          if (-not (Test-Path $dll)) { throw "AfxHookSource2.dll was not produced" }
          "{0:N2} MB" -f ((Get-Item $dll).Length / 1MB)

      - name: Upload the hook
        uses: actions/upload-artifact@v4
        with:
          name: AfxHookSource2
          path: |
            advancedfx/build/x64-release/AfxHookSource2/Release/AfxHookSource2.dll
            advancedfx/build/x64-release/AfxHookSource2/Release/AfxHookSource2.pdb
          if-no-files-found: error

      # Everything the hook cannot run without, in the one layout it can run from, so that
      # assembling a release is copying a directory rather than knowing this list.
      #
      # The layout is forced, not chosen (docs/experiments/21-what-the-zip-has-to-contain.md):
      # GetHlaeFolder() is computed from the hook DLL's own module path by stripping the file
      # name and then one more directory, so resources\ has to be the PARENT of the directory
      # the DLL sits in. And the DLL is found by GetModuleHandleW(L"AfxHookSource2.dll"), by
      # that exact name, so it may not be renamed or version-stamped. Both failures are
      # silent: no error, just no shaders.
      - name: Stage the hook tree
        shell: pwsh
        run: |
          $stage = "stage/hook"
          New-Item -ItemType Directory -Force "$stage/x64" | Out-Null
          New-Item -ItemType Directory -Force "$stage/resources/shaders" | Out-Null

          # Ours, plus the five OpenEXR libraries the hook imports statically for image
          # output - loaded whether or not anything is ever recorded, so they are not
          # optional. They land in bin/Release, NOT beside the hook.
          Copy-Item advancedfx/build/x64-release/AfxHookSource2/Release/AfxHookSource2.dll "$stage/x64/"
          foreach ($n in 'OpenEXR-3_3','OpenEXRCore-3_3','Iex-3_3','IlmThread-3_3','Imath-3_1') {
            Copy-Item "advancedfx/build/x64-release/bin/Release/$n.dll" "$stage/x64/"
          }

          # The OpenXR loader is opened by path at runtime, never linked, and the hook looks
          # for it beside itself first. Apache-2.0, shipped rather than made a prerequisite.
          Copy-Item openxr/pkg/native/x64/release/bin/openxr_loader.dll "$stage/x64/"

          # The C++ runtime, beside the DLL, so that running this is not conditional on
          # having installed a Microsoft redistributable. Taken from the toolchain's own
          # redist directory rather than from System32: those are the files Microsoft
          # licenses for redistribution, and System32's may be newer than we built against.
          $redist = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue |
                    Sort-Object FullName | Select-Object -Last 1
          if (-not $redist) { throw "VC143 x64 redist not found on the runner; the zip would need a redistributable installed." }
          foreach ($n in 'MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll') {
            Copy-Item (Join-Path $redist.FullName $n) "$stage/x64/"
          }

          # The six shaders the Source 2 hook actually loads, by name, from
          # CampathDrawer.cpp and RenderSystemDX11Hooks.cpp. The ps20/vs20 ones in a full
          # HLAE install are Source 1's and are not copied. The .h beside each .acs is a
          # build artifact compiled into the DLL, not something opened at runtime.
          foreach ($n in 'afx_line_vs_5_0','afx_line_ps_5_0','afx_drawtexture_vs_5_0',
                         'afx_drawtexture_ps_5_0','afx_depth_vs_5_0','afx_depth_ps_5_0') {
            Copy-Item "advancedfx/shaders/build/$n.acs" "$stage/resources/shaders/"
          }

          # CampathDrawer's font. Small, and its absence is a crash rather than a warning.
          Copy-Item advancedfx/resources/resources/hexfont.tga "$stage/resources/"

          # advancedfx's own licence travels with advancedfx's own code. The hook DLL is
          # mostly theirs; MIT asks for the notice to go with it, and a release that drops
          # it is not redistributable. resources\LICENSES in their tree covers NGettext,
          # which is not shipped, so it is the root LICENSE that matters.
          Copy-Item advancedfx/LICENSE "$stage/LICENSE-advancedfx.txt"

          # Nothing else. AfxHook.dat is Source 1 and GoldSrc; AfxCppCli, NGettext, the
          # other games' hooks and HLAE.exe itself are never loaded into cs2 - checked
          # against a running game's module list, not guessed.
          $missing = @()
          foreach ($p in "$stage/x64/AfxHookSource2.dll", "$stage/x64/openxr_loader.dll",
                         "$stage/x64/MSVCP140.dll", "$stage/resources/hexfont.tga",
                         "$stage/resources/shaders/afx_depth_ps_5_0.acs") {
            if (-not (Test-Path $p)) { $missing += $p }
          }
          if ($missing) { throw "staging incomplete: $($missing -join ', ')" }

          Get-ChildItem $stage -Recurse -File |
            ForEach-Object { "{0,10:N0}  {1}" -f $_.Length, (Resolve-Path $_.FullName -Relative) }
          "total {0:N2} MB" -f ((Get-ChildItem $stage -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      # Consumed by the release workflow, which unpacks it as hook\ inside the zip. Kept
      # here rather than there so that a change to what the hook needs is made in the same
      # place as the change that needed it.
      - name: Upload the staged hook tree
        uses: actions/upload-artifact@v4
        with:
          name: hook-tree
          path: stage/hook
          if-no-files-found: error
