// CS2 Game State Integration - this project's probe config. See docs/experiments/24.
//
// Install BY HAND to:  <CS2>\game\csgo\cfg\gamestate_integration_cs2vr.cfg
//
// NOT to cfg\cs2vr\, and NOT via deploy-cfg.ps1, and that is not an oversight:
//   - CS2 only scans cfg\ itself for gamestate_integration_*.cfg, never subdirectories, so
//     it cannot live with the rest of our configs.
//   - deploy-cfg.ps1 deletes loose copies in cfg\ of every name it ships, so if this file
//     sat in scripts\cs2\ the deploy would remove the copy the game needs.
// That is why it is here, next to gsi-listen.ps1, rather than in scripts\cs2\.
//
// The port is 57448 and must stay off 57444: that is the shipped SteelSeries endpoint. Both
// configs can be present and both are honoured, so ours is additive and must never replace
// gamestate_integration_steelseries.cfg.
//
// THIS CONFIG HAS NO "auth" BLOCK, AND NOTHING THAT SHIPS MAY COPY IT AS IT STANDS.
// CS2 POSTs a plain JSON body with no custom header, so a listener on 57448 cannot tell the
// game apart from any other process on this machine: without auth, anything local can post a
// fabricated game state and be believed. Loopback is necessary and not sufficient - the same
// thing that was true of the control server's HTTP guard. Anything permanent adds:
//
//   "auth" { "token" "<generated per install>" }
//
// and the listener rejects a payload whose "auth" does not match. The token is generated
// where the file is installed and is NOT committed here; a shared secret in a public
// repository is not a secret. Tracked on issue #15.
"cs2-vr-spectator probe"
{
  // Asking for EVERYTHING, on purpose. This config exists to find out what CS2 actually
  // sends, in a demo and in a bot game, rather than what the documentation implies - so the
  // answer has to come from the payload and not from which keys we thought to request.
  //
  // The two that decide the design:
  //   allplayers_*      the player list the operator wants kept. Spectator-only in CS:GO;
  //                     unverified for CS2 demos, which is the whole point of this probe.
  //   player_position   also spectator-only, and would let a name tag follow a body.
  "uri" "http://127.0.0.1:57448/cs2vr"
  "timeout" "5.0"
  "buffer"  "0.0"
  "throttle" "0.1"
  "heartbeat" "10.0"
  "data"
  {
    "provider"                 "1"
    "map"                      "1"
    "map_round_wins"           "1"
    "round"                    "1"
    "phase_countdowns"         "1"
    "bomb"                     "1"
    "player_id"                "1"
    "player_state"             "1"
    "player_weapons"           "1"
    "player_match_stats"       "1"
    "player_position"          "1"
    "allplayers_id"            "1"
    "allplayers_state"         "1"
    "allplayers_match_stats"   "1"
    "allplayers_weapons"       "1"
    "allplayers_position"      "1"
    "allgrenades"              "1"
  }
}
