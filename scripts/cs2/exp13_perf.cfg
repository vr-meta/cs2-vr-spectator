// Experiment 13: what do the game's graphics settings cost, at VR resolution?
//
// Install to:  <CS2>\game\csgo\cfg\exp13_perf.cfg   then  +exec exp13_perf
//
// Issue #1 lists the game's graphics settings as the first lever and notes they have been
// untouched for the whole project -- CS2 has been running at its defaults, at 2528x2780
// per eye, for every measurement so far. This config is the instrument for finding out
// what they are worth.
//
// It runs without a headset. The frame rate submitted to a headset is not the same number
// as the engine's frame time, but the *ratio* between two settings at the same resolution
// is, and that is what a lever is judged by.

mirv_cvar_unhide_all

// Uncapped, or the measurement is of the cap and not of the game.
//
// `+fps_max 0` on the command line does NOT do this. CS2 loads
// userdata\<id>\730\local\cfg\cs2_machine_convars.vcfg afterwards, and that file here
// carries fps_max 120 and fps_max_tools 120 -- which is why three runs at 640x480,
// 1770x1946 and 2528x2780 all came out at exactly 8.5 ms a frame. Setting it from a
// config that runs at startup, and again from a key, is what actually takes.
fps_max 0
fps_max_tools 0

bind "F6" "fps_max 0; fps_max_tools 0"
bind "F7" "fps_max 120; fps_max_tools 120"

bind "F1" "exec cs2vr/exp00_dump"

// --- measurement ---
// Twenty seconds is long enough for the tail to mean something and short enough to run
// several of. The label goes in the report so two runs are not confused.
bind "F2" "mirv_vr_frametime 20 baseline"
bind "F3" "mirv_vr_frametime 20 low"
bind "F4" "mirv_vr_frametime 20 restored"
bind "F5" "mirv_vr_frametime 0"

echo "[exp13] F1 dump cvars | F2/F3/F4 sample | F6 uncap | F7 cap at 120"
