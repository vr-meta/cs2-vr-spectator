// Experiment 24, second half: GSI in an actual game rather than a demo.
//
// Install to:  <CS2>\game\csgo\cfg\cs2vr\exp24_gsi_play.cfg
// Run with:    scripts\launch-cs2-experiment.ps1 -SelfBuilt -ExecCfg exp24_gsi_play
//
// The demo half answers whether the player list is possible. This half answers whether the
// three things the operator actually looks at while playing - health, the weapon and the
// bomb - arrive as data instead of as pixels cut out of CS2's own HUD. Those two HUD
// rectangles are estimates today, and cutting them out of the frame is what breaks Tab
// (#13) and team select. Data would not have that failure mode at all.
//
// Bots on a bomb map on purpose: the bomb keys only say anything once there is a bomb.
map de_dust2

// The map needs a moment. If these arrive before it is ready, they do nothing and have to
// be sent again through the pipe - which is not a failure of the probe.
sv_cheats 1
mp_limitteams 0
mp_autoteambalance 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_freezetime 1
mp_warmup_end
bot_kick
bot_quota_mode normal
bot_quota 8
bot_difficulty 1

echo ============================================================
echo EXP24 GSI probe - bots on de_dust2, no headset session
echo ============================================================
