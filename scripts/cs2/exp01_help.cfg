// Dumps HLAE's own help for the commands experiment 01 needs.
//
// Install to:  <CS2>\game\csgo\cfg\exp01_help.cfg
// Run with:    exec exp01_help
// Output:      game/csgo/console.log  (needs -condebug, which the launch script sets)
//
// HLAE prints built-in help when a command is invoked with no arguments. Reading it
// from the log beats reverse-engineering the argument parser out of the source.

echo "[exp01] ---- mirv_streams ----"
mirv_streams
echo "[exp01] ---- mirv_streams add ----"
mirv_streams add
echo "[exp01] ---- mirv_streams edit ----"
mirv_streams edit
echo "[exp01] ---- mirv_streams record ----"
mirv_streams record
echo "[exp01] ---- mirv_streams settings ----"
mirv_streams settings
echo "[exp01] ---- mirv_streams print ----"
mirv_streams print
echo "[exp01] ---- mirv_input ----"
mirv_input
echo "[exp01] ---- mirv_camio ----"
mirv_camio
echo "[exp01] ---- DONE ----"
