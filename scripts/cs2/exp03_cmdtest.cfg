// Can a concommand be put into beforeCommands at all?
//
// Install to:  <CS2>\game\csgo\cfg\exp03_cmdtest.cfg
// Run with:    exec exp03_cmdtest
//
// Earlier conclusion - "beforeCommands accepts convars only" - was WRONG. Reading
// CAfxStreams::ExecuteCommands further shows it falls back to FindCommand and
// DispatchConCommand when the name is not a convar. So commands are supported.
//
// Yet mirv_input never appeared in the printed list. This isolates why: each add is
// followed immediately by a print, so it is obvious which one fails to stick.

mirv_streams edit eyeR beforeCommands clear

echo "[exp03] --- 1. plain convar ---"
mirv_streams edit eyeR beforeCommands add r_drawviewmodel 0
mirv_streams edit eyeR beforeCommands print

echo "[exp03] --- 2. concommand, no args ---"
mirv_streams edit eyeR beforeCommands add mirv_input
mirv_streams edit eyeR beforeCommands print

echo "[exp03] --- 3. concommand with positive numbers ---"
mirv_streams edit eyeR beforeCommands add mirv_input position 100 200 300
mirv_streams edit eyeR beforeCommands print

echo "[exp03] --- 4. concommand with NEGATIVE numbers ---"
// Suspect: the console may treat a leading '-' as something other than an argument.
mirv_streams edit eyeR beforeCommands add mirv_input position -412.449768 -2196.836182 -115.380615
mirv_streams edit eyeR beforeCommands print

echo "[exp03] --- 5. negatives quoted ---"
mirv_streams edit eyeR beforeCommands add mirv_input position "-412.449768" "-2196.836182" "-115.380615"
mirv_streams edit eyeR beforeCommands print

echo "[exp03] --- DONE ---"
