// Where the HUD groups hang, as a file that can be re-applied without restarting.
//
// Install next to vr.cfg. vr_keys.cfg execs it last, so PgDn then PgUp - swap to the
// diagnostics layout and back - re-reads this file in the running game. That is the only
// way to iterate on the layout while somebody is wearing the headset, because there is no
// console in a worn launch: the window is 2528x2780 on a 2560x1600 display, Windows clamps
// it, and Panorama lays the console out for the full 2780 rows, putting its input line
// below the bottom of the screen.
//
// scripts/send-key.ps1 -Key PGDN then -Key PGUP presses them from outside.
//
// Empty on purpose. The defaults live in the code, where they belong once they have been
// judged in a headset; this is the scratchpad for judging the next set.
//
//   mirv_vr_panel region <group> <azimuth> <elevation> <width-degrees> [distance]
//   mirv_vr_panel region <group> on|off
//   mirv_vr_panel rect   <group> <u0> <v0> <u1> <v1>
//   mirv_vr_panel spread <k> | more | less
//   mirv_vr_panel layout        prints all of it to console.log
//
// Groups: score, radar, bar, killfeed. Azimuth is positive to the left, elevation up.

mirv_vr_panel layout
