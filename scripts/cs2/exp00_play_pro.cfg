// Plays the professional GOTV demo, which replaced the locally recorded one.
//
// Install to:  <CS2>\game\csgo\cfg\exp00_play_pro.cfg
// Run with:    exec exp00_play_pro
//
// Why not the bot demo: the locally recorded exp00_demo.dem does not replay. The
// console filled with
//     Cannot process snapshot tick N, it is a delta from tick N-1, which we do not have
// and in-game nothing moved - bots frozen, camera unresponsive. A still image cannot
// respond to a view offset, so every measurement taken against it is void.
//
// This one is a GOTV demo of a real match (MOUZ vs Natus Vincere, mirage), which also
// gives real smoke, grenades and player movement - the content stereo is most likely
// to break on.

bind "F4" "demo_pause"
bind "F3" "demo_resume"
bind "F2" "demo_timescale 0.25"
bind "F1" "demo_timescale 1"

echo ""
echo "=== [exp00] pro demo ==="
echo "  F4 pause / F3 resume / F2 slow / F1 normal"
echo ""
echo "FIRST: confirm the demo actually plays - players must be MOVING. If nothing"
echo "moves, the demo is not replaying and no measurement from it means anything."
echo ""
echo "Do not drag the timeline slider: it crashed the game on build 2000908."
echo ""

playdemo pro_mirage
