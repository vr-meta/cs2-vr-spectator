// Experiment 17 - what field of view do the eye passes actually render?
//
//   scripts\launch-cs2-experiment.ps1 -SelfBuilt -Demo pro_mirage.dem -ExecCfg exp17_fov `
//       -Width 2528 -Height 2780
//
// A desk experiment. F9 is deliberately not bound: putting a headset on inside a
// measurement launch is how an afternoon was lost to a quarter-resolution session.
//
// The crop hands the runtime a sub-rectangle of a symmetric image, computed from the angle
// we believe we rendered. If the engine renders a different angle, the world is shown at
// the wrong size and slides against every head turn by the difference.
//
// With the crop in place a correct pipeline is INVARIANT to the number: render and crop
// assumption move together, so the world must look the same size at 120 as at 150, only
// sharper or coarser. If it changes size, the engine is not rendering what it is handed.
//
// Do not test below 108: the left eye's crop then runs off the edge of the image, gets
// clamped, and the re-derived frustum is ignored by a runtime that reports fovMutable
// false. That is a wrong picture, not a degraded one.
//
// F5 is the cheapest answer of the three. Source's fov is defined at 4:3 and the engine
// widens it for the window afterwards; what nobody knows is whether it does so IN PLACE,
// in the same field, before the passes run. If it does, the per-pass write is in the wrong
// convention. One printed float settles it.

mirv_cvar_unhide_all

bind "F1" "mirv_vr_xr passes 2"
bind "F2" "mirv_vr_xr passes 0"
bind "F3" "demo_togglepause"
bind "F4" "mirv_vr_views"
bind "F5" "mirv_vr_fovraw 3"
bind "F6" "mirv_vr_fov 120"
bind "F7" "mirv_vr_fov 150"
bind "F8" "mirv_vr_fov auto"
bind "F10" "mirv_vr_log 3"

echo "[exp17] F1/F2 force passes on/off | F3 pause | F4 views | F5 the raw fov field"
echo "[exp17] F6/F7 fov 120/150 - the world must NOT change size | F8 auto | F10 log"
