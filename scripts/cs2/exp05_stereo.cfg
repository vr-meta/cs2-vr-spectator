// Phase C: is the stereo pair correct?
//
// Install to:  <CS2>\game\csgo\cfg\exp05_stereo.cfg
// Run with:    exec exp05_stereo
//
// Phase B proved the eyes can differ. This asks whether they differ only by viewpoint,
// at a real interpupillary distance rather than the 20 units used to make the effect
// unmissable, and on the content that breaks stereo most often: smoke, particles,
// tracers, shadows.
//
// CS2 units are inches, so a 63 mm interpupillary distance is 2.5 units. That is eight
// times smaller than the phase B test, and the difference between the eyes should be
// correspondingly subtle - which is the point.
//
// The decisive measurement needs no eyes at all: with separation 0 on a PLAYING demo,
// the two passes must still come out bit-identical. If they do not, something advances
// between passes - the pass loop does call SceneSystem::FrameUpdate between them - and
// the eyes would see different moments of the same smoke.
//
// All actions are on F-keys and driven from outside; see docs/workflow.md.

echo "[exp05] ---- hook check ----"
mirv_vr_eyes

mirv_streams add normal eyeL
mirv_streams add normal eyeR

mirv_streams edit eyeL beforeCommands clear
mirv_streams edit eyeR beforeCommands clear

// Differing commands are what splits the two streams into separate render passes.
mirv_streams edit eyeL beforeCommands add echo AFXVR-PASS-eyeL
mirv_streams edit eyeR beforeCommands add echo AFXVR-PASS-eyeR

mirv_streams edit eyeL worldAction draw
mirv_streams edit eyeR worldAction draw

mirv_vr_eyes 0

mirv_streams record name exp05_stereo
mirv_streams record format tga

echo "[exp05] ---- streams ----"
mirv_streams print

bind "F2" "demo_timescale 0.1"
bind "F3" "demo_timescale 1"
bind "F4" "demo_togglepause"
bind "F5" "mirv_vr_eyes 0"
bind "F9" "mirv_vr_eyes 2.5"
bind "F10" "mirv_vr_eyes 6"
bind "F6" "mirv_streams record start"
bind "F8" "mirv_vr_log 3"
bind "F7" "mirv_streams record end"

echo ""
echo "=== [exp05] ready ==="
echo "  F4 pauses/resumes. Everything else is driven from outside."
echo "  Close the console and say done."
echo ""
