// Experiment 20 - can the main pass be made cheap, given its image is thrown away?
//
//   scripts\launch-cs2-experiment.ps1 -SelfBuilt -Demo pro_mirage.dem -ExecCfg exp20_pass0 `
//       -Width 2528 -Height 2780
//
// A desk experiment: F9 is not bound. Three scene traversals are about 11 ms of a 29 ms
// frame (experiment 13), and with the HUD panel on the MAIN pass's world is wiped before
// the UI is composited - so one of those three produces an image that is erased.
//
// Two thresholds matter on a 72 Hz panel, not a continuum. Below 36 the frame is shown
// alternately two and three times and the cadence beats, which is what makes the residual
// edge smear uneven. At a steady 36 every frame is shown exactly twice. At 72 there is no
// reprojection fill at all. Today is 34, which is the worst place on that curve, and the
// expected saving of 3 to 3.5 ms lands at 38 or 39 - over the first threshold, nowhere
// near the second. Worth writing down before anyone hopes otherwise.
//
// The measurement:
//   F1 forces the two eye passes, F5 turns the panel on (which is what makes the main
//   pass's world disposable), then F6/F7/F8 choose the variant and F9/F10 sample.
//
// The thing that could make the saving fake: if the eye images change at all between
// variants, something the engine fits to pass 0's view - shadow cascades, probe choice,
// streaming, occlusion history - is reaching them. Record on a paused frame and diff.

mirv_cvar_unhide_all

// This is a DESK launch. It cannot start a headset session - F9 is not the session key
// here - and from outside it looks exactly like a real one, which has already cost
// somebody a headset on their face and a key press into nothing. Say so on F9.
bind "F9" "echo [desk] This window is a measurement. For the headset, close it and run scripts\start-vr.ps1"

bind "F1" "mirv_vr_xr passes 2"
bind "F2" "mirv_vr_xr passes 0"
bind "F3" "demo_togglepause"
bind "F4" "mirv_vr_xr ui out"
bind "F5" "mirv_vr_panel on"
bind "F6" "mirv_vr_pass0 off"
bind "F7" "mirv_vr_pass0 tiny"
bind "F8" "mirv_vr_pass0 up"
bind "DOWNARROW" "mirv_vr_frametime 20"
bind "F10" "mirv_vr_frametime 0"
bind "F11" "mirv_streams record start"
bind "F12" "mirv_streams record end"

echo "[exp20] F1/F2 passes | F3 pause | F4 ui out | F5 panel on"
echo "[exp20] F6/F7/F8 pass 0: off / tiny / up | DOWNARROW sample 20 s | F10 stop"
echo "[exp20] F11/F12 record the eye images, to diff between variants"
