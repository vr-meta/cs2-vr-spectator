// Experiment 15: can the client be made to place the HUD per eye?
//
// Install to:  <CS2>\game\csgo\cfg\exp15_hudfix.cfg   then  +exec exp15_hudfix
//
// Issue #3: name tags and health numbers are placed with a world-to-screen matrix the
// client builds once a frame, from the camera in the middle, while the HUD itself is drawn
// once per pass. In an eye rendered from somewhere else they float free of the players.
//
// The open question in that issue was whether this is cheap or deep. mirv_vr_hudfix is the
// cheap answer: ask the engine to redo its own matrix work after the eye pose is written.
//
// Visible without a headset. mirv_vr_xr passes 2 renders the eye passes with no session,
// and the monitor ends up showing the last of them -- so with an exaggerated eye offset the
// displacement is plain, and so is its absence.

mirv_cvar_unhide_all
fps_max 0
fps_max_tools 0
cl_drawhud 1

bind "F2" "mirv_vr_xr passes 2"
bind "F3" "mirv_vr_xr passes 0"

// Far more than an interpupillary distance: 40 units is about a metre, so the tags cannot
// be nearly right by accident.
bind "F4" "mirv_vr_ipd 40"
bind "F5" "mirv_vr_eye off"

bind "F6" "mirv_vr_remakematrix 1"
bind "F7" "mirv_vr_remakematrix 0"

bind "F8" "demo_togglepause"

echo "[exp15] F2 passes on | F4 exaggerated eyes | F6/F7 remakematrix on/off | F8 pause"
