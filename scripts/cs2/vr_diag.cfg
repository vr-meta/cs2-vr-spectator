// The stereo diagnostics layout, swapped in by PGDN and swapped back out by PGUP.
//
// These used to live at the bottom of vr.cfg, where they silently took F1, F2, F3, F4,
// F6, F7, F8, F11, F12, INS and DEL off the everyday bindings above them. Now they are a
// mode you enter on purpose, and leave.
//
// Most of what is here answered its question in
// docs/experiments/00-results.md and is kept because a regression would show up on one of
// these keys faster than anywhere else: crop off is what the broken stereo looked like.

// --- stopping and starting stays reachable, because the latency switch needs it ---
// The canonical OpenXR threading split locates the head at the top of the frame it is
// drawn for, instead of a frame late. A frame is 28 ms, which is what turning your head
// into a rubber band feels like.
//
// NOT a session restart on one key. Stopping and immediately recreating the session in the
// same frame destroys the swapchains while the render thread may still be copying into
// them: the runtime answers XR_ERROR_GRAPHICS_DEVICE_INVALID, the D3D device is removed,
// and the game dies with it. That is how it was found. So: HOME, then F9 or F10, then END.
bind "HOME" "mirv_vr_xr stop"
bind "END"  "mirv_vr_xr start"
bind "F9"   "mirv_vr_xr latency low"
bind "F10"  "mirv_vr_xr latency safe"

// F1 prints what the runtime reports for each eye: how far apart they are along the head's
// own right axis, each eye's yaw, and how asymmetric each frustum is.
bind "F1" "mirv_vr_views"

// The crop is the fix for the stereo divergence: the Oculus runtime reports
// fovMutable = FALSE and composites with its own asymmetric frustum whatever field of view
// the layer claims, so the image is rendered symmetric and submitted as the covered
// sub-rectangle of it. F3 turns that off, which is what the broken version looked like.
bind "F2" "mirv_vr_crop 1"
bind "F3" "mirv_vr_crop 0"

// Frustum centring: rotating each eye outward to the centre of its own frustum. It made
// fusion worse, because the Quest's two displays have no such relative rotation, and
// because the eye rotation here is added as Euler angles rather than composed. Off by
// default; kept because the reasoning is easy to re-convince oneself of and hard to
// re-measure.
bind "F4" "mirv_vr_centre 1"
bind "F5" "mirv_vr_centre 0"

// F6 swaps the eyes, which separates "they are the wrong way round" from "the frustums do
// not match" in one press. F7/F8 collapse to one eye in both, which separates a stereo
// fault from a rendering fault.
bind "F6" "mirv_vr_xr swap"
bind "F7" "mirv_vr_xr mono 1"
bind "F8" "mirv_vr_xr mono 0"

// Frames actually submitted to the headset, logged every two seconds. The game's own
// counter also counts frames the headset never sees.
bind "F11" "mirv_vr_xr fps 1"
bind "F12" "mirv_vr_xr fps 0"

// Mouse sensitivity, if the 0.05 vr.cfg sets is wrong.
bind "INS" "mirv_input cfg msens 0.02"
bind "DEL" "mirv_input cfg msens 0.15"

bind "PGUP" "exec vr_keys"

echo "[vr-diag] HOME/END session stop/start | F9/F10 latency low/safe (stop first)"
echo "[vr-diag] F1 views | F2/F3 crop on/off | F4/F5 centre on/off"
echo "[vr-diag] F6 swap eyes | F7/F8 mono on/off | F11/F12 fps log on/off"
echo "[vr-diag] INS/DEL mouse slower/faster | PGUP back to the everyday keys"
