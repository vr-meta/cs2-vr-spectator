// Key bindings for VR work, executed at startup with +exec vr.
//
// Install to:  <CS2>\game\csgo\cfg\vr.cfg
//
// With a VR runtime running, CS2 becomes hard to interact with - it stalls on present and
// the window stops taking input reliably. Typed console text cannot be synthesised either
// (see docs/workflow.md). Key presses can, so everything goes on a key and is driven from
// outside with scripts/send-key.ps1.
//
// A bind only stores a string, so it works even if the command it names is not registered
// yet when this runs.

// Sensitivity well below the default. On a monitor a fast camera is just fast; in a
// headset the same motion is read by the inner ear as the world lurching.
// Unhide the developmentonly convars, so the HUD switches below actually take.
mirv_cvar_unhide_all

mirv_input cfg msens 0.05
mirv_input cfg ksens 0.3

// --- headset ---
bind "F9" "mirv_vr_xr start"
bind "F5" "mirv_vr_xr stop"

// --- where the view comes from ---
// F6/F7 choose the vantage point: fly it yourself, or sit where the demo puts you.
bind "F6" "mirv_input camera"
bind "F7" "mirv_input end"

// F8/F10 choose what the demo is allowed to do to your head. Free look on means only the
// position is taken from the demo - following a player then no longer drags your head
// around with their aim, which is what makes it bearable.
bind "F8"  "mirv_vr_freelook 1"
bind "F10" "mirv_vr_freelook 0"

// F1 points free look where the demo camera is facing.
bind "F1" "mirv_vr_recenter"

// --- mouse sensitivity, if 0.05 is wrong ---
bind "F11" "mirv_input cfg msens 0.02"
bind "F12" "mirv_input cfg msens 0.15"

// --- demo ---
bind "F2" "demo_timescale 0.1"
bind "F3" "demo_timescale 1"
bind "F4" "demo_togglepause"

// --- how the controllers feel ---
// All four started as guesses and can be changed while wearing the headset, which is the
// only place the answer is visible. mirv_vr_controls prints the whole mapping.
//
//   mirv_vr_speed <units/s>          how fast the left stick flies
//   mirv_vr_turn snap|smooth [n]     stepped or continuous turning
//   mirv_vr_stick <deadzone> [curve] how the sticks are shaped
//   mirv_vr_seek <seconds>           how far one trigger press moves

echo "[vr] F9/F5 headset | F6/F7 free camera | F8/F10 free look | F1 recenter"
echo "[vr] F4 pause | F2/F3 speed | F11/F12 mouse slower/faster"
echo "[vr] controllers: mirv_vr_controls"

// Frame rate actually submitted to the headset, logged every two seconds. This is the
// number phase E turns on - the game's own counter also counts frames the headset never
// sees.
// On from the start, so a resolution change can be judged rather than guessed at.
mirv_vr_xr fps 1

bind "INS" "mirv_vr_xr fps 1"
bind "DEL" "mirv_vr_xr fps 0"

// --- HUD ---
// Player name tags are placed with the projection computed once for the main pass, so in
// an eye rendered from a different camera they drift off the players they belong to. A
// flat HUD at screen depth is wrong in a headset anyway.
// Off by default: in stereo the tags are simply wrong.
cl_drawhud 0

// --- stereo diagnostics ---
// Last in the file on purpose. A bind is last-one-wins, and an earlier attempt to put
// these on HOME and END was silently eaten by the HUD binds further down.
//
// F11 prints what the runtime reports for each eye: how far apart they are along the
// head's own right axis, each eye's yaw, and how asymmetric each frustum is.
// F12 swaps the eyes, which separates "they are the wrong way round" from "the frustums
// do not match" in one press.
// INS/DEL turn the Source field-of-view correction on and off. We ask CS2 for 108 degrees
// and on a portrait window it renders about 86, because the engine's fov is defined at
// 4:3. Claiming a frustum the image does not have corrupts the stereo disparity in
// proportion to the eye separation.
bind "F11" "mirv_vr_views"
bind "F12" "mirv_vr_xr swap"
bind "INS" "mirv_vr_fovfix 1"
bind "DEL" "mirv_vr_fovfix 0"

bind "HOME" "cl_drawhud 0"
bind "END"  "cl_drawhud 1"
