// Settings for VR work, executed at startup with +exec vr.
//
// Install to:  <CS2>\game\csgo\cfg\vr.cfg
// Together with vr_keys.cfg and vr_diag.cfg, which live in the same directory.
//
// With a VR runtime running, CS2 becomes hard to interact with - it stalls on present and
// the window stops taking input reliably. Typed console text cannot be synthesised either
// (see docs/workflow.md). Key presses can, so everything goes on a key and is driven from
// outside with scripts/send-key.ps1.
//
// This file holds only settings. The keys are in vr_keys.cfg, and the stereo diagnostics
// in vr_diag.cfg, because a bind is last-one-wins and mixing the two in one file cost an
// evening: the echo lines said "F8 free look" while F8 set an OpenXR latency mode.

// Unhide the developmentonly convars, so the HUD switches below actually take.
mirv_cvar_unhide_all

// Sensitivity well below the default. On a monitor a fast camera is just fast; in a
// headset the same motion is read by the inner ear as the world lurching.
mirv_input cfg msens 0.05
mirv_input cfg ksens 0.3

// --- how the controllers feel ---
// All four started as guesses and can be changed while wearing the headset, which is the
// only place the answer is visible. mirv_vr_controls prints the whole mapping.
//
//   mirv_vr_speed <units/s>          how fast the left stick flies
//   mirv_vr_turn snap|smooth [n]     stepped or continuous turning
//   mirv_vr_stick <deadzone> [curve] how the sticks are shaped
//   mirv_vr_seek <seconds>           how far one seek press moves
//   mirv_vr_triggers players|seek|fov what the two triggers are for

// Frame rate actually submitted to the headset, logged every two seconds. The line also
// carries the session state when it is not FOCUSED, and how many frames behind the render
// thread was - a collapsed rate with the session merely VISIBLE is the compositor not
// scheduling us, which is not the same problem at all.
mirv_vr_xr fps 1

// Locate the head at the top of the frame it is drawn for, instead of a frame behind. Set
// before the session starts, because the two arrangements cannot be swapped under a
// running one.
//
// This was off for a long time and for a good reason that no longer applies: it used to
// race on the frame state with the render thread. Each frame now carries its own pose and
// display time, so the race is gone and what is left is a halving of how stale the pose
// is - which is what decides how wide the smeared band at the edge of a turn gets.
mirv_vr_xr latency low

// --- what the demo is allowed to do to your head ---
// Free look ON. Only the position is taken from the demo; the orientation is yours. With
// it off, the spectated player's aim turns your world - a professional's flick is ninety
// degrees in a tenth of a second, and no headset makes that pleasant. F10 turns it off if
// a fixed vantage point following the demo's own camera is what is wanted.
mirv_vr_freelook 1

// Snap turning rather than smooth. Rotation the body did not ask for is the main cause of
// sickness in VR, and at 36 frames a second a smooth sweep also judders by construction.
mirv_vr_turn snap 30

// The HUD is drawn at the window size and then scaled down onto a quad, so every pixel it
// is given back is a pixel of legibility. The score was unreadable before this.
hud_scaling 1

// --- TrueView ---
// Off. TrueView re-simulates the player you are watching on its own clock, advanced once
// per rendered frame - and HLAE runs the client frame path three times per real frame for
// the two eyes, so that clock is stepped, rewound and re-stepped every frame. The log says
// so out loud: "Not enough TrueView command lookahead" on every switch. What the operator
// sees is the one player they are watching frozen in the pose he held when they attached,
// while everyone else runs around normally - which is exactly the entity whose prediction
// time keeps going backwards, and nobody else.
//
// cl_demo_predict 2 puts it back, if this turns out to be the wrong culprit.
cl_demo_predict 0

// And its status text off the panel: it is drawn in the corner of the sheet and carried
// into the headset for no reason.
cl_trueview_show_status 0

// --- the HUD ---
// cl_drawhud is global: one switch for the eyes and the panel alike. So it stays ON, the
// eyes capture BEFORE the UI is composited, and the HUD goes to a quad in space instead -
// where it has a fixed place in the room, a readable size, and real depth.
//
// The quad carries the main pass with the world wiped out of it, so it is the HUD on
// nothing. Measured before it was trusted: docs/experiments/16-the-hud-on-a-panel.md.
// DEL turns the panel off, HOME turns the HUD off entirely.
mirv_vr_xr ui out
cl_drawhud 1
mirv_vr_panel on

// Calibration stays OFF. Putting the dials on the face buttons made sense - the person who
// can see the problem is the one wearing the headset - but it meant the settings moved
// while they were being measured, and every reading was taken from a different state than
// the one being described. One hand on the dials at a time.
mirv_vr_calibrate 0
mirv_vr_reset

exec vr_keys
