// Phase B, question 2: does a per-pass camera offset actually reach the image?
//
// Install to:  <CS2>\game\csgo\cfg\exp04_stereo.cfg
// Run with:    exec exp04_stereo     (demo PAUSED, after exp04_probe)
//
// Only meaningful if exp04_probe showed the trampoline running once per pass. Uses
// the same two streams; the only change is that the hook now shifts pass 1 left and
// pass 2 right along the view's right vector.
//
// 20 units (~50 cm) is deliberately far larger than a real interpupillary distance.
// Eye scale comes in phase C; right now the question is only whether the offset is
// respected at all, and a 2.5-unit shift would be hard to tell from none.

mirv_vr_eyes 20

echo "[exp04] ---- arming ----"
mirv_vr_log 3

mirv_streams record name exp04_stereo

echo ""
echo "=== [exp04 stereo] ready ==="
echo "  F6 record start / F8 arm log / F7 record end"
echo ""
echo "Expected: the two output folders differ by a horizontal camera translation,"
echo "with near geometry shifting more than far. If they are identical, the offset"
echo "is being computed but discarded somewhere after the view setup."
echo ""
