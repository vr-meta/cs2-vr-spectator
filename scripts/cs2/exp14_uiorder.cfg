// Experiment 14: when is the UI composited, relative to the eye passes?
//
// Install to:  <CS2>\game\csgo\cfg\exp14_uiorder.cfg   then  +exec exp14_uiorder
//
// Issue #2 says the demo's UI is baked into both eyes and therefore doubled. Issue #3 says
// the world-anchored HUD -- name tags, health -- lands in the wrong place. Both rest on
// the same unexamined assumption about *when* the UI is drawn: once a frame, or once a
// pass.
//
// If once a frame, after all passes, then the eyes cannot contain the UI and the premise
// of #2 is wrong. If once a pass, they can, and moving the capture to BeforeUi is the fix
// the issue proposes.
//
// mirv_vr_xr passes 2 renders the eye passes with no session and no headset. Nothing is
// submitted; the point is that the probe output becomes available at a desk.

mirv_cvar_unhide_all
fps_max 0
fps_max_tools 0

bind "F2" "mirv_vr_xr passes 2"
bind "F3" "mirv_vr_xr passes 0"

// Three frames is plenty -- the question is about ordering within a frame, and the log
// lines are one per pass.
bind "F4" "mirv_vr_log 3"

// Separate the eyes visibly, so a dumped pass can be told apart from the main one by
// eye rather than by bookkeeping.
bind "F5" "mirv_vr_ipd 2.5"
bind "F6" "mirv_vr_eye off"

bind "F9" "mirv_vr_xr ui out"
bind "F10" "mirv_vr_xr ui in"

bind "F11" "mirv_vr_panel on"
bind "F12" "mirv_vr_panel off"

bind "F7" "cl_drawhud 1"
bind "F8" "cl_drawhud 0"

echo "[exp14] F2 force 2 passes | F4 log 3 frames | F5 eyes on | F7/F8 hud on/off"
