// Experiment 24: does Game State Integration give us enough for our own HUD.
//
// Install to:  <CS2>\game\csgo\cfg\cs2vr\exp24_gsi.cfg
// Run with:    scripts\launch-cs2-experiment.ps1 -SelfBuilt -Demo pro_mirage -ExecCfg exp24_gsi
//
// This cfg deliberately does almost nothing. The measurement is not in the game at all -
// it is the JSON arriving at a listener outside it, and the questions are ones only the
// payload can answer:
//
//   1. Does GSI work at all with -insecure and a DLL injected? Every route we have to the
//      game's state today is a struct offset, and one CS2 update from stale. GSI is
//      versioned, documented output; if it works here it is a different class of answer.
//   2. Does a DEMO produce payloads, and do they carry allplayers_*? The operator wants the
//      player list kept, and allplayers_* was spectator-only in CS:GO. Whether that still
//      holds in a CS2 demo has never been measured here, and the whole player-list half of
//      the HUD stands on it.
//
// The GSI config itself is NOT in this directory. CS2 only scans for
// gamestate_integration_*.cfg directly in cfg\, not in subdirectories, so it cannot live in
// cfg\cs2vr\ with everything else of ours - which means deploy-cfg.ps1 would delete it as a
// stale loose copy. It is copied by hand for this probe. If the design proves out, that
// exception needs writing down: the README promises we only write to cfg\cs2vr\.
//
// No map, no session, no headset. A demo at a desk.
echo ============================================================
echo EXP24 GSI probe - demo, no headset session
echo ============================================================
