// Phase D step 2: the per-eye pose interface, and the last unverified lever.
//
// Install to:  <CS2>\game\csgo\cfg\exp07_pose.cfg
// Run with:    exec exp07_pose
//
// The ad-hoc per-pass code from experiments 04 and 06 is now a module with one
// interface, mirv_vr_eye, which is what an OpenXR layer will drive from xrLocateViews:
// an offset in the spectator camera's own frame, an angle delta, and a fov.
//
// Two things to establish:
//
//   1. Regression. The same separation must still produce the same stereo pair, and
//      separation 0 must still produce identical images. Moving working code is exactly
//      when a silent break happens.
//   2. Angles. Position and fov are measured; the angle fields at +0x4b8 are not. Head
//      tracking needs them, so they are the last lever to check before writing the
//      OpenXR session.
//
// F10 turns the right eye 20 degrees. That is far past any interpupillary effect, so it
// cannot be confused with the stereo offset.

echo "[exp07] ---- hook check: this must list three passes ----"
mirv_vr_eye

mirv_streams add normal eyeL
mirv_streams add normal eyeR

mirv_streams edit eyeL beforeCommands clear
mirv_streams edit eyeR beforeCommands clear
mirv_streams edit eyeL beforeCommands add echo AFXVR-PASS-eyeL
mirv_streams edit eyeR beforeCommands add echo AFXVR-PASS-eyeR

mirv_vr_eye off

mirv_streams record name exp07_pose
mirv_streams record format tga

bind "F2" "demo_timescale 0.1"
bind "F3" "demo_timescale 1"
bind "F4" "demo_togglepause"
bind "F5" "mirv_vr_eye off"
bind "F9" "mirv_vr_ipd 2.5"
bind "F10" "mirv_vr_eye 2 0 0 0 0 20 0 0"
bind "F6" "mirv_streams record start"
bind "F8" "mirv_vr_log 3"
bind "F7" "mirv_streams record end"

echo ""
echo "=== [exp07] ready ==="
echo "  F4 pauses. Everything else is driven from outside."
echo ""
