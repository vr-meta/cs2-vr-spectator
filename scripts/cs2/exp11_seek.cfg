// Experiment 11: does seeking in a demo work, and does it still crash?
//
// Install to:  <CS2>\game\csgo\cfg\exp11_seek.cfg   then  exec exp11_seek
//
// Three questions from GitHub issue #4:
//   1. does demo_gototick work reliably during playback, with the hook attached?
//   2. does seeking backwards behave differently from forwards?
//   3. does it survive being done repeatedly, the way someone scrubbing would?
//
// Driven from outside with scripts/send-key.ps1, because with a headset attached the
// game window does not take typed input reliably -- and because a scripted sequence is
// the only honest way to ask question 3.
//
// Everything goes through mirv_vr_seek, which is the same code path a controller trigger
// takes. Testing the command directly would answer a question nobody asked.

mirv_cvar_unhide_all

// Where are we? Prints the tick, the seconds elapsed and the tick interval.
bind "F1" "mirv_vr_seek where"

// Question 1 and 2: one seek at a time, forwards and backwards.
bind "F2" "mirv_vr_seek now 10"
bind "F3" "mirv_vr_seek now -10"
bind "F4" "mirv_vr_seek now 60"
bind "F5" "mirv_vr_seek now -60"

// Seeking to before the demo starts, which is the documented way to break this. The
// hook clamps to tick 1; this checks the clamp rather than trusting it.
bind "F6" "mirv_vr_seek now -100000"

// Question 3: scrubbing. Six seeks with no pause between them, which is what dragging a
// timeline slider actually produces and what crashed the game on day one of this project.
// Note these land in the SAME frame, so the hook coalesces them into one seek -- that is
// the behaviour under test, not a flaw in the experiment.
bind "F7" "mirv_vr_seek now 5; mirv_vr_seek now 5; mirv_vr_seek now 5; mirv_vr_seek now -5; mirv_vr_seek now -5; mirv_vr_seek now 5"

// The harsher case -- separate seeks in separate frames -- is driven from outside by
// pressing F2/F3 repeatedly, which is what a hand on a timeline actually produces. No
// alias chain here: scripting it in the config would only test the config.

// Pause, because seeking while paused is a different case and the menu will do it.
bind "F9"  "demo_togglepause"

// A large jump, to see whether distance matters.
bind "F10" "mirv_vr_seek now 600"

echo "[exp11] F1 where | F2/F3 +-10s | F4/F5 +-60s | F6 before the start"
echo "[exp11] F7 six seeks in one frame | F9 pause | F10 +10 min"
