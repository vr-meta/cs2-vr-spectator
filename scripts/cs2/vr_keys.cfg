// The everyday key layout for a session in the headset.
//
// Executed by vr.cfg at startup, and again by vr_diag.cfg's PGUP when the stereo
// diagnostics are done with.
//
// ONE COMMAND PER KEY. A bind is last-one-wins and CS2 says nothing when a later line
// takes a key off an earlier one, so for a while F8 read "free look" in the echo at the
// top of the file and set an OpenXR latency mode when pressed. The person pressing these
// has a headset on and cannot see the console. scripts/check-cfg.ps1 fails the build if a
// key is ever bound twice in one file again.

// --- headset ---
bind "F9" "mirv_vr_xr start"
bind "F5" "mirv_vr_xr stop"

// --- where the view comes from ---
// F6/F7 choose the vantage point: fly it yourself, or sit where the demo puts you.
bind "F6" "mirv_input camera"
bind "F7" "mirv_input end"

// F8/F10 choose what the demo is allowed to do to your head. Free look on means only the
// position is taken from the demo - following a player then no longer drags your head
// around with their aim, which is what makes it bearable.
bind "F8"  "mirv_vr_freelook 1"
bind "F10" "mirv_vr_freelook 0"

// F1 points free look where the demo camera is facing.
bind "F1" "mirv_vr_recenter"

// --- demo ---
bind "F2" "demo_timescale 0.1"
bind "F3" "demo_timescale 1"
bind "F4" "demo_togglepause"

// --- the HUD panel ---
// The score, the round timer and the kill feed, on a quad in space instead of smeared
// across both eyes at screen depth. INS/DEL switch it, F11 re-places it in front of where
// you are looking now. The same toggle is on the left controller's menu button.
bind "INS" "mirv_vr_panel on"
bind "DEL" "mirv_vr_panel off"
bind "F11" "mirv_vr_panel place"

// F12 puts the viewer back on the demo camera and undoes any stick movement.
bind "F12" "mirv_vr_reset"

// cl_drawhud is global: it feeds the panel as well as the eyes, so it stays on and the
// eyes stay clean by capturing before the UI is composited (mirv_vr_xr ui out).
bind "HOME" "cl_drawhud 0"
bind "END"  "cl_drawhud 1"

// --- who you are watching ---
// The most basic thing a spectator does, and for a while the only way to do it was to
// know that the demo listens for MOUSE1. The arrows are next/previous player and the
// demo's own camera cycle - the same taps the left hand's Y, X and right grip send.
//
// If F6's free camera is on, it owns the view and switching players moves nothing you can
// see; F7 hands it back. The controller buttons now do that for you, these do not.
// THE CONTROLLER DEPENDS ON THESE THREE. The demo's spectator input is driven from the key
// event, not from the button state a console "+attack" sets, so the hook synthesises a real
// RIGHT, LEFT or UP key press and lets these binds do the rest. Without them the triggers
// and the left stick click do nothing at all - which is exactly how it was found: the
// keyboard arrows switched players and the controller did not, running the same command by
// two different routes.
bind "RIGHTARROW" "+attack"
bind "LEFTARROW"  "+attack2"
bind "UPARROW"    "+jump"

// PGUP prints the controller mapping to the console; PGDN swaps in the stereo diagnostics.
bind "PGUP" "mirv_vr_controls"
bind "PGDN" "exec vr_diag"

echo "[vr] F9/F5 headset | F6/F7 free camera | F8/F10 free look | F1 recenter | F12 reset"
echo "[vr] RIGHTARROW/LEFTARROW next/previous player | UPARROW the demo's camera cycle"
echo "[vr] F4 pause | F2/F3 speed 0.1x/1x | INS/DEL panel on/off | F11 re-place panel"
echo "[vr] HOME/END seek back/forward 10s | triggers: next/previous player"
echo "[vr] right stick click hides the HUD, hold it to recentre | left stick click: camera"
echo "[vr] PGUP controller map | PGDN stereo diagnostics"
