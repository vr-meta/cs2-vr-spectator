// THE decisive test: can the camera differ between two passes of one frame?
//
// Install to:  <CS2>\game\csgo\cfg\exp03_percam.cfg
// Run with:    exec exp03_percam      (demo PAUSED)
// Then:        F6 record start, ~2s, F7 record end
//
// If this works, stereo needs no code change at all - the two eyes are two streams
// whose beforeCommands set different camera positions, and everything else already
// exists.
//
// Baseline camera (from mirv_input on the paused pro demo):
//   -452.449768  -2196.836182  -115.380615
//
// The offsets here are large on purpose (40 units, ~1 m). Eye-scale separation comes
// later; right now the only question is whether a per-pass camera change is respected
// at all, and a too-small offset would be indistinguishable from no effect.

mirv_input camera

mirv_streams edit eyeL beforeCommands clear
mirv_streams edit eyeR beforeCommands clear

// Both streams draw everything; they differ only by camera position.
mirv_streams edit eyeL worldAction draw
mirv_streams edit eyeR worldAction draw

mirv_streams edit eyeL beforeCommands add mirv_input position -492.449768 -2196.836182 -115.380615
mirv_streams edit eyeR beforeCommands add mirv_input position -412.449768 -2196.836182 -115.380615

echo "[exp03] --- eyeL ---"
mirv_streams edit eyeL beforeCommands print
echo "[exp03] --- eyeR ---"
mirv_streams edit eyeR beforeCommands print

mirv_streams record name exp03_percam

echo ""
echo "=== [exp03] per-pass camera test ==="
echo "  F6 record start / F7 record end"
echo ""
echo "eyeL and eyeR differ ONLY by camera X (-40 vs +40). If the outputs differ with"
echo "correct parallax, per-pass camera works and phase B needs no code."
echo ""

bind "F6" "mirv_streams record start"
bind "F7" "mirv_streams record end"
