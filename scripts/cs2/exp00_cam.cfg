// Spectator camera controls for the demo, on keys that do not clash with the
// F5-F8 offset sweep.
//
// Install to:  <CS2>\game\csgo\cfg\exp00_cam.cfg
// Run with:    exec exp00_cam
//
// Why this matters beyond convenience: spec_pos prints the exact camera position and
// angles, and spec_goto restores them. Once a good frame is found, the viewpoint can
// be reproduced exactly on later runs - which is what makes comparing screenshots
// across sessions meaningful.

bind "v" "spec_mode 6"      // free roaming camera
bind "b" "spec_next"
bind "n" "spec_prev"
bind "m" "spec_pos"         // prints position + angles to console (cheat-flagged)

echo ""
echo "=== [exp00] camera ==="
echo "  V - free roaming camera (then WASD + mouse to fly)"
echo "  B / N - next / previous player"
echo "  M - print current position and angles"
echo ""
echo "In free camera, frame a shot with BOTH near geometry (a wall or crate a few"
echo "metres away) and far geometry (across the site). Parallax between the two is"
echo "exactly what distinguishes a real camera offset from a flat image shift."
echo ""
echo "Once framed: press M and keep the printed values - spec_goto reproduces the"
echo "same viewpoint later."
echo ""
