// Experiment 22: which rectangle is which at the main menu.
//
// The menu panel showed the operator a frame they could not reconcile with where their
// ray went. console.log proved the panel's source at the menu is 2560x1600 - the desktop
// mode - while the engine's own render pipeline and display mode are 2528x2780, and the
// pointer maps onto a third rectangle, GetClientRect. In game all three are 2528x2780,
// which is why only the menu is wrong and why this survived to a worn session.
//
// This cfg does nothing but mark the log and turn the hook's extra logging on. The
// measurement is external: the window's client and window rects, read while the game sits
// at the main menu. No map, no demo, no session - a headset session is exactly what must
// not happen here, which is why this is an exp cfg and not vr.cfg.
echo ============================================================
echo EXP22 window geometry probe - main menu, no map, no session
echo ============================================================
mirv_vr_log 1
