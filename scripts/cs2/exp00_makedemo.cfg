// Records a local demo to test against. Needed from experiment 00 step 2 onward.
//
// Install to:  <CS2>\game\csgo\cfg\exp00_makedemo.cfg
// Run with:    exec exp00_makedemo
// Output:      <CS2>\game\csgo\exp00_demo.dem
//
// Why bots rather than a downloaded pro match: full control over the scene. The
// stereo checks need geometry at known distances and, later, smoke and particles -
// the effects most likely to break when a frame is rendered twice.

// A map with clear near/far geometry for judging parallax.
map de_dust2

// Give the map a moment, then set up. If this cfg runs before the map is ready,
// run the lines below by hand.
sv_cheats 1
mp_limitteams 0
mp_autoteambalance 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_freezetime 1
mp_warmup_end
bot_kick
bot_quota_mode normal
bot_quota 10
bot_difficulty 2

echo ""
echo "=== [exp00] demo recording ==="
echo "  record exp00_demo     - start recording"
echo "  stop                  - finish; writes game/csgo/exp00_demo.dem"
echo ""
echo "Record 30-60 seconds with movement and, if you can, a smoke grenade:"
echo "smoke is the effect most likely to break under two-pass stereo, so having"
echo "it in the demo makes the milestone 3 check meaningful."
echo ""
echo "Then: playdemo exp00_demo   and   demo_pause"
echo ""
