// Does mirv_input actually move the camera on a paused demo?
//
// Install to:  <CS2>\game\csgo\cfg\exp01_camtest.cfg
// Run with:    exec exp01_camtest
//
// This replaces the dead cl_demo_view_offset_left. mirv_input is HLAE's camera
// override and is in active use for fragmovie work, so it is expected to function -
// but "expected" is what the Valve convar had going for it too, so it gets measured
// the same way.
//
// Baseline camera state, read from mirv_input on the paused pro demo:
//   position  -452.449768  -2196.836182  -115.380615
//   angles       0.459993     46.227703     0.000000
//   fov         90
//
// The offsets below are deliberately huge (40 units, about a metre). This test only
// asks "does it move at all"; eye-scale offsets come later, once the mechanism is
// known to work. A dead override and a too-small offset look identical, and that
// confusion already cost one round of measurements.

mirv_input camera

bind "F5" "mirv_input position -452.449768 -2196.836182 -115.380615"   // baseline
bind "F6" "mirv_input position -492.449768 -2196.836182 -115.380615"   // x -40
bind "F7" "mirv_input position -412.449768 -2196.836182 -115.380615"   // x +40
bind "F8" "mirv_input position -452.449768 -2196.836182  -75.380615"   // z +40 (up)

echo ""
echo "=== [exp01] mirv_input camera test ==="
echo "  camera input mode ENABLED - the view is now driven by mirv_input"
echo "  F5 baseline / F6 x-40 / F7 x+40 / F8 z+40"
echo ""
echo "Note: camera input mode may capture mouse and keyboard for camera control."
echo "mirv_input end  - leaves the mode."
echo ""
