// Phase D, step 1: can the projection differ between passes?
//
// Install to:  <CS2>\game\csgo\cfg\exp06_projection.cfg
// Run with:    exec exp06_projection
//
// A headset needs an asymmetric frustum per eye. Right now both passes use the game's
// own symmetric projection, built in CViewRender::UnkMakeMatrix. The question is the
// same one phase B asked about the camera: is it built once per frame, or once per pass?
//
// There is a reason to expect the useful answer. The view setup trampoline runs once per
// frame, AFTER all passes - yet a per-pass camera change does reach the image. So
// something inside OnClientOutput reads the view struct and builds the matrices for that
// pass, and UnkMakeMatrix is the candidate. If it runs per pass, then writing the fov
// field per pass gives per-eye projection through the lever that already works.
//
// The indicator is deliberately unmissable: +40 degrees on the right eye only. A fov that
// wide cannot be confused with anything else.

echo "[exp06] ---- hook check: both must print a value ----"
mirv_vr_eyes
mirv_vr_fovtest

mirv_streams add normal eyeL
mirv_streams add normal eyeR

mirv_streams edit eyeL beforeCommands clear
mirv_streams edit eyeR beforeCommands clear
mirv_streams edit eyeL beforeCommands add echo AFXVR-PASS-eyeL
mirv_streams edit eyeR beforeCommands add echo AFXVR-PASS-eyeR

// No camera offset: this run isolates the projection.
mirv_vr_eyes 0
mirv_vr_fovtest 0

mirv_streams record name exp06_proj
mirv_streams record format tga

bind "F2" "demo_timescale 0.1"
bind "F3" "demo_timescale 1"
bind "F4" "demo_togglepause"
bind "F5" "mirv_vr_fovtest 0"
bind "F9" "mirv_vr_fovtest 40"
bind "F6" "mirv_streams record start"
bind "F8" "mirv_vr_log 3"
bind "F7" "mirv_streams record end"

echo ""
echo "=== [exp06] ready ==="
echo "  F4 pauses. Everything else is driven from outside."
echo ""
