// Experiment 00, steps 2-5 - probe the stereo convars on a paused demo.
//
// Install to:  <CS2>\game\csgo\cfg\exp00_probe.cfg
// Run with:    exec exp00_probe        (AFTER loading a demo and pausing it)
//
// This only reports current state and binds the sweep to keys. It deliberately
// does not change anything on its own, so that nothing is altered before the
// starting screenshot is taken.

echo ""
echo "=== [exp00] convar existence check ==="
echo "Each line below should echo a value. 'Unknown command' means the convar"
echo "is absent from this build - or that mirv_cvar_unhide_all was not run."
echo ""

cl_demo_view_offset_left
cl_demoviewoverride
cl_demo_steadycam_enable
r_stereo_multiview_instancing

echo ""
echo "=== [exp00] keys bound ==="
echo "  F5  offset  0.00   (baseline - screenshot this first)"
echo "  F6  offset -1.25   (left eye)"
echo "  F7  offset +1.25   (right eye)"
echo "  F8  offset +10.0   (exaggerated, to make a dead stub obvious)"
echo "  F9  screenshot"
echo ""
echo "Take a screenshot at each value from an identical paused frame."
echo "Compare parallax between NEAR and FAR geometry across the shots:"
echo "  - nothing moves            -> dead stub, this line of inquiry ends"
echo "  - near and far shift alike -> flat 2D pan, not a camera move"
echo "  - near shifts more         -> real camera offset, which is what we want"
echo ""

bind "F5" "cl_demo_view_offset_left 0"
bind "F6" "cl_demo_view_offset_left -1.25"
bind "F7" "cl_demo_view_offset_left 1.25"
bind "F8" "cl_demo_view_offset_left 10"
bind "F9" "screenshot"

sv_cheats 1
