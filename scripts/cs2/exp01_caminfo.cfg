// Step 1 of the camera test: find out what mirv_input position/angles accept and
// what the current camera state is.
//
// Install to:  <CS2>\game\csgo\cfg\exp01_caminfo.cfg
// Run with:    exec exp01_caminfo
// Output:      game/csgo/console.log
//
// mirv_input is HLAE's camera override. Unlike cl_demo_view_offset_left it is in
// active use for fragmovie work, so it is expected to actually function - that is
// what makes it the replacement candidate for moving the eye between passes.
//
// This only queries. It does not enable the override, so the view will not jump.

echo "[exp01] ---- mirv_input position (help/current) ----"
mirv_input position
echo "[exp01] ---- mirv_input angles ----"
mirv_input angles
echo "[exp01] ---- mirv_input fov ----"
mirv_input fov
echo "[exp01] ---- mirv_input cfg ----"
mirv_input cfg
echo "[exp01] ---- mirv_input mem ----"
mirv_input mem
echo "[exp01] ---- mirv_camio export ----"
mirv_camio export
echo "[exp01] ---- DONE ----"
