// Plays the test demo slowly, with pause on a key.
//
// Install to:  <CS2>\game\csgo\cfg\exp00_play.cfg
// Run with:    exec exp00_play     (ONCE - see the warning below)
//
// The demo is ~25 s and runs to the end on its own, which leaves no time to freeze a
// good frame. demo_timescale stretches it so the pause can be placed deliberately.
//
// WARNING: do not exec this twice, and do not call playdemo while a demo is already
// playing. Doing so produced:
//     CDemoPlayer::StartPlayback: couldn't open demo file 'exp00_demo.dem'
//     -> access violation crash one second later  (2026-09-18, build 2000908)
// If the demo has finished, restart the game rather than replaying it.

bind "F4" "demo_pause"
bind "F3" "demo_resume"
bind "F2" "demo_timescale 0.15"
bind "F1" "demo_timescale 1"

echo ""
echo "=== [exp00] demo playback ==="
echo "  F2 - slow down to 0.15x   (press immediately)"
echo "  F4 - pause                (freeze on near AND far geometry, ideally smoke)"
echo "  F3 - resume,  F1 - normal speed"
echo ""
echo "Pause matters: both eyes must come from ONE simulation state. If the demo is"
echo "still advancing, differences between shots come from the world moving, not from"
echo "the eye offset - and the test proves nothing."
echo ""

playdemo exp00_demo
