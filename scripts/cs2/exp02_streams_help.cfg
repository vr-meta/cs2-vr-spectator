// Creates two test streams and dumps their edit help, to learn the exact syntax for
// per-pass commands.
//
// Install to:  <CS2>\game\csgo\cfg\exp02_streams_help.cfg
// Run with:    exec exp02_streams_help
// Output:      game/csgo/console.log
//
// Why two streams: per CStreamSettings::CompareRenderPass (note 02), streams whose
// beforeCommands differ are placed in SEPARATE render passes. If mirv_input position
// can be put in those commands, the two passes become the two eyes.
//
// This only creates stream definitions and prints help. Nothing is recorded, and the
// view is not touched.

echo "[exp02] ---- add two streams ----"
mirv_streams add normal eyeL
mirv_streams add normal eyeR

echo "[exp02] ---- edit help ----"
mirv_streams edit eyeL

echo "[exp02] ---- beforeCommands help ----"
mirv_streams edit eyeL beforeCommands

echo "[exp02] ---- current streams ----"
mirv_streams print

echo "[exp02] ---- record settings ----"
mirv_streams record name
mirv_streams record format
mirv_streams record screen

echo "[exp02] ---- DONE ----"
