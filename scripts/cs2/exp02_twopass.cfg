// Does HLAE render one frame twice with DIFFERENT settings per pass?
//
// Install to:  <CS2>\game\csgo\cfg\exp02_twopass.cfg
// Run with:    exec exp02_twopass
//
// Two questions, deliberately separated:
//
// A) Does the multi-pass machinery work at all, and do beforeCommands apply per pass?
//    Tested with r_drawviewmodel, a convar known to work and trivially visible.
//
// B) Can mirv_input position be used as a per-pass command?
//    Expected to FAIL: AfxStreams::ExecuteCommands resolves each command through
//    FindConVar and assigns to the convar's value. mirv_input is a concommand, not a
//    convar, so there is likely nothing to assign to. Tested anyway - the source read
//    could be wrong, and this is the cheapest possible way to find out.
//
// If A works and B fails, stereo needs a per-pass camera hook added to HLAE's pass
// loop. That is the fallback, and it is understood work rather than unknown work.

mirv_streams edit eyeL beforeCommands clear
mirv_streams edit eyeR beforeCommands clear

// A: viewmodel on in one pass, off in the other
mirv_streams edit eyeL beforeCommands add r_drawviewmodel 1
mirv_streams edit eyeR beforeCommands add r_drawviewmodel 0

// B: and a camera move in one of them
mirv_streams edit eyeR beforeCommands add mirv_input position -412.449768 -2196.836182 -115.380615

echo "[exp02] ---- eyeL commands ----"
mirv_streams edit eyeL beforeCommands print
echo "[exp02] ---- eyeR commands ----"
mirv_streams edit eyeR beforeCommands print

mirv_streams record name exp02_twopass
mirv_streams record format tga

echo ""
echo "=== [exp02] ready ==="
echo "  F6 - start recording"
echo "  F7 - stop recording"
echo ""
echo "Recording writes one folder per stream under the take directory. Compare the"
echo "two images of the SAME frame: if they differ by viewmodel, per-pass settings"
echo "work. If they also differ by camera position, mirv_input works per pass too."
echo ""

bind "F6" "mirv_streams record start"
bind "F7" "mirv_streams record end"
