// Phase B, question 1: is the view setup trampoline called once per FRAME or once
// per RENDER PASS?
//
// Install to:  <CS2>\game\csgo\cfg\exp04_probe.cfg
// Run with:    exec exp04_probe
// Output:      game/csgo/console.log
//
// Requires the self-built hook with the AFXVR probe (mirv_vr_log / mirv_vr_eyes).
// If those commands are unknown, the released HLAE is loaded and nothing below means
// anything - see docs/workflow.md.
//
// Two streams whose beforeCommands DIFFER, which per CompareRenderPass forces them
// into separate render passes. The hook logs three things while the log is armed:
// every OnClientOutput enter/leave, every render pass boundary, and every view setup
// call. Their interleaving answers the question directly.
//
// The record keys are pressed from outside by scripts/send-key.ps1, so this only sets
// them up. Do NOT leave recording running: it writes ~300 MB per second.

echo "[exp04] ---- hook check: this must print a value, not 'Unknown command' ----"
mirv_vr_eyes

echo "[exp04] ---- streams (already-in-use errors are harmless) ----"
mirv_streams add normal eyeL
mirv_streams add normal eyeR

mirv_streams edit eyeL beforeCommands clear
mirv_streams edit eyeR beforeCommands clear

// Markers only. They differ, which is what splits the two streams into two passes.
mirv_streams edit eyeL beforeCommands add echo AFXVR-PASS-eyeL
mirv_streams edit eyeR beforeCommands add echo AFXVR-PASS-eyeR

// No camera offset in this run - it measures the call pattern, nothing else.
mirv_vr_eyes 0

mirv_streams record name exp04_probe
mirv_streams record format tga

echo "[exp04] ---- streams ----"
mirv_streams print

bind "F2" "demo_timescale 0.1"
bind "F4" "demo_togglepause"
bind "F5" "mirv_vr_eyes 0"
bind "F9" "mirv_vr_eyes 20"
bind "F6" "mirv_streams record start"
bind "F8" "mirv_vr_log 3"
bind "F7" "mirv_streams record end"

echo ""
echo "=== [exp04] ready ==="
echo "  F4 pauses the demo. Then close the console and say done."
echo "  F5/F9 (eye separation) and F6/F8/F7 (record) are driven from outside."
echo ""
