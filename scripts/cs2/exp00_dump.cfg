// Experiment 00, step 1 - capture the ground-truth convar list for THIS build.
//
// Install to:  <CS2>\game\csgo\cfg\exp00_dump.cfg
// Run with:    exec exp00_dump
// Output:      <CS2>\game\csgo\console.log   (requires -condebug at launch)
//
// Community convar dumps cover only clientdll and gamedll. The renderer convars
// this project cares about (r_stereo_multiview_instancing) live elsewhere, so the
// only trustworthy list is the one this build prints itself.
//
// Run mirv_cvar_unhide_all first, otherwise developmentonly convars stay hidden
// and the list will be misleadingly short.
//
// Note: CS2 has no con_logfile and no version command - both are Source 1. Console
// output is captured by launching with -condebug, and the build id comes from
// game/csgo/steam.inf instead.

echo "[exp00] ---- BEGIN CVARLIST ----"

cvarlist

echo "[exp00] ---- END CVARLIST ----"

// Targeted searches, so the interesting names are easy to find in the log.
echo "[exp00] ---- find stereo ----"
find stereo
echo "[exp00] ---- find multiview ----"
find multiview
echo "[exp00] ---- find demo_view ----"
find demo_view
echo "[exp00] ---- find eye ----"
find eye
echo "[exp00] ---- DONE ----"
