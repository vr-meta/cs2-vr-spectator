// Experiment 16 - can the panel carry the HUD alone?
//
//   scripts\launch-cs2-experiment.ps1 -SelfBuilt -Demo pro_mirage.dem -ExecCfg exp16_panel
//
// No headset and no runtime. F1 forces the two eye passes so the whole pass loop runs,
// and the panel hands the main pass over whether or not a session exists, so the alpha
// read-back works from a desk.
//
// The question: the HUD is drawn onto a back buffer we have just wiped to transparent
// black, and the quad is composited with source alpha. Whether that leaves anything
// visible depends on what Panorama writes to the ALPHA channel, which nobody knows.
// F7 counts it.

mirv_cvar_unhide_all

bind "F1" "mirv_vr_xr passes 2"
bind "F2" "mirv_vr_xr passes 0"
bind "F3" "cl_drawhud 1"
bind "F4" "cl_drawhud 0"
bind "F5" "mirv_vr_panel on"
bind "F6" "mirv_vr_panel off"
bind "F7" "mirv_vr_panel alpha 3"
bind "F8" "mirv_vr_panel transparent"
bind "F9" "mirv_vr_panel opaque"
bind "F10" "mirv_vr_log 3"
bind "F11" "demo_togglepause"
bind "F12" "spec_show_xray 1"

echo "[exp16] F1/F2 passes on/off | F3/F4 hud on/off | F5/F6 panel on/off"
echo "[exp16] F7 read the alpha channel | F8/F9 transparent/opaque | F10 log"
echo "[exp16] F11 pause | F12 xray"
