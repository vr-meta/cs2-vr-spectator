// Second attempt at proving per-pass settings, with an indicator that is actually
// visible in the current view.
//
// Install to:  <CS2>\game\csgo\cfg\exp02_twopass2.cfg
// Run with:    exec exp02_twopass2
//
// First attempt used r_drawviewmodel, which changed nothing because the spectator view
// has no weapon model on screen at all. The convars registered correctly - the log
// showed both streams holding their value - but there was nothing for them to affect.
// A correct mechanism and a badly chosen indicator look identical in the output.
//
// This uses HLAE's own per-stream actions instead of convars. worldAction and
// playersAction are what the multi-pass machinery was built for, so if per-pass
// rendering works at all, it works here.

mirv_streams edit eyeL beforeCommands clear
mirv_streams edit eyeR beforeCommands clear

echo "[exp02b] ---- action help ----"
mirv_streams edit eyeR worldAction
mirv_streams edit eyeR playersAction

echo "[exp02b] ---- applying ----"
// eyeL stays default (everything drawn).
// eyeR: noDraw the world, so the two passes cannot possibly look alike.
// Valid values are draw|noDraw|zOnly - "hide" was guessed wrong the first time and
// the command silently printed help instead of applying.
mirv_streams edit eyeR worldAction noDraw

echo "[exp02b] ---- eyeR settings ----"
mirv_streams print

mirv_streams record name exp02c

echo ""
echo "=== [exp02b] ready ==="
echo "  F6 start recording / F7 stop  (2-3 seconds is plenty)"
echo ""
echo "eyeL draws the world, eyeR does not. If the two output folders differ, the"
echo "passes are genuinely independent renders of the same frame."
echo ""

bind "F6" "mirv_streams record start"
bind "F7" "mirv_streams record end"
